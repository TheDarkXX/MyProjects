<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>DrBank AFF Scout v2.0 — Web UI Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="app-header">
    <div class="brand-wrap">
      <div class="brand-logo">⚡</div>
      <div>
        <div class="brand-title">DrBank AFF Scout <span id="popup-version-badge" class="ver-badge">v2.0.0</span></div>
        <div class="brand-sub">Shopee Winning SKU & Web UI Bridge</div>
      </div>
    </div>
    <button id="popup-theme-btn" class="btn btn--ghost" style="padding:4px 9px;" title="สลับโหมด สว่าง/มืด">🌙</button>
  </header>

  <main class="launcher-body">
    <!-- Connection Status & Queue Summary -->
    <div class="status-card">
      <div class="status-row">
        <span class="status-dot" id="webui-status-dot"></span>
        <span class="status-text" id="webui-status-text">กำลังตรวจสอบการเชื่อมต่อ Web UI...</span>
      </div>
      <div class="queue-stats">
        <div>
          <div class="stat-label">สินค้าที่คัดไว้ในคิว</div>
          <div class="stat-val" id="stat-sku-count">0 รายการ</div>
        </div>
        <div>
          <div class="stat-label">เกณฑ์คุ้มทุนแอด</div>
          <div class="stat-val" style="color:var(--p-accent);">100฿ (+VAT 107฿)</div>
        </div>
      </div>
    </div>

    <!-- Big Hero Button: Open Full-Screen Web UI Command Center -->
    <button class="btn btn--hero" id="btn-launch-webui">
      🖥️ เปิด Shopee × Meta Command Center (Web UI)
    </button>

    <div class="btn-grid-2">
      <button class="btn btn--emerald" id="btn-copy-all-json">📋 ก๊อป JSON สินค้า (<span id="btn-sku-count">0</span>)</button>
      <button class="btn btn--ghost" id="btn-clear-queue">🗑️ ล้างคิวแคช</button>
    </div>

    <!-- Compact Bridge Settings -->
    <div class="card">
      <div class="card-title">⚙️ ตั้งค่าสะพานเชื่อม Web UI & เรทเริ่มต้น</div>
      <div style="margin-bottom:8px;">
        <label>Web UI Server URL (Full-Screen Dashboard)</label>
        <input type="url" id="set-webui-url" class="inp" placeholder="http://localhost:3000">
      </div>
      <div class="form-grid-3">
        <div>
          <label>Base (%)</label>
          <input type="number" step="0.1" id="set-shopee-base" class="inp">
        </div>
        <div>
          <label>Extra (%)</label>
          <input type="number" step="0.5" id="set-shopee-extra" class="inp">
        </div>
        <div>
          <label>Cap (฿)</label>
          <input type="number" step="10" id="set-shopee-cap" class="inp">
        </div>
      </div>
      <div class="btn-row" style="margin-top:9px;">
        <button class="btn btn--ghost" style="width:100%;" id="btn-save-settings">💾 บันทึกการตั้งค่า</button>
      </div>
      <div id="settings-saved-msg" style="font-size:11px;color:var(--p-green);text-align:center;margin-top:5px;display:none;">
        ✔ บันทึกและอัปเดตสถานะเซิร์ฟเวอร์เรียบร้อย!
      </div>
    </div>
  </main>

  <script src="src/common/utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
