  metaphor_mapping:
    ข้อเสื่อม: "Rusted mechanical hinge joint grinding with flying sparks"
    ตับทำงานหนัก: "Overloaded factory machine overheating, steam bursting, red warning lights flashing"
    ลำไส้ไม่ดี: "Clogged dirty pipe system with dark sludge slowly oozing"
    เผาผลาญไขมัน: "Glowing furnace melting wobbly gelatin fat blocks, dripping golden liquid"
    คอลลาเจนถูกทำลาย: "Sharp crystal sugar shards piercing through bouncy pink collagen matrix, particles scattering"
    ภูมิคุ้มกันอ่อนแอ: "Crumbling castle wall, dark invaders approaching through the cracks"
    หลอดเลือดตีบ: "Narrowing tunnel with flowing golden particles slowing down and congesting"

  example_prompt:
    subtitle: "น้ำตาลที่คุณกินเข้าไปทุกวัน มันจะเข้าไปทำลายคอลลาเจนใต้ผิวหนัง"
