# =====================================================
category_g_lifestyle:
  name: "ไลฟ์สไตล์ & กิจกรรม (Lifestyle — Aspirational UGC)"
  trigger_keywords: ["ออกกำลังกาย", "ยืดเส้น", "เดิน", "วิ่ง", "โยคะ", "นอน", "ตื่น", "น้ำ", "ดื่มน้ำ", "นิสัย", "ทุกเช้า", "ทุกวัน", "เปลี่ยน", "ลองทำ"]

  video_rules: >
    - สไตล์: Aspirational lifestyle photography, warm and motivational, 8K, cinematic
    - ตัวแบบ: Well-groomed middle-class Thai woman, aged 40-60 (เดียวกับ Category A แต่อารมณ์ดี มีพลัง สดใส)
    - เสื้อผ้า: Casual comfortable activewear or clean home clothing (ไม่ใช่ชุด gym แบบนางแบบฟิตเนส)
    - เฟรม: Medium shot (MS) หรือ Medium Close-up (MCU)
    - กล้อง: Smooth tracking shot or gentle handheld, natural fluid motion
    - แสง: Warm golden hour / soft morning light, lens flares welcome
    - สถานที่: สวนสาธารณะเขียวๆ, ห้องนั่งเล่นสะอาดสว่าง, ห้องนอนตอนเช้ามีแสงทอง
    - อารมณ์: สดใส มีความสุข มีพลัง ดูมีสุขภาพดี (ตรงข้ามกับ Category A ที่ดูเจ็บปวด)
    - จังหวะ: Energetic but graceful, natural movement
    - ห้าม: ดูเหมือนโฆษณา gym / นางแบบฟิตเนส, ท่าทางเกร็งไม่เป็นธรรมชาติ
    - ความยาว: 3-4 วินาที

  classic_shots:
    ยืดเส้น: >
      Medium shot of a well-groomed Thai woman aged 50 stretching her arms overhead
      in a bright modern living room. Genuine peaceful smile, morning sunlight
      streaming through clean white curtains, energetic but graceful movement.
      Casual comfortable home clothing, healthy and refreshed appearance.
    เดิน: >
      Smooth tracking shot following a well-groomed Thai woman walking briskly
      in a lush green park. Golden hour lighting creating warm lens flares,
      healthy and energetic expression, casual comfortable activewear.
      Trees and greenery in soft bokeh background.
    ดื่มน้ำ: >
      MCU of a well-groomed Thai woman drinking a glass of crystal-clear water
      in a clean modern kitchen, morning sunlight highlighting the water.
      Fresh and healthy look, satisfied expression after drinking.
    นอนหลับดี: >
      Medium shot of a Thai woman sleeping peacefully on a clean white bed with
      plump pillows. Soft warm morning light streaming in through sheer curtains,
      serene gentle expression, slight smile. Premium bedding, calming atmosphere.
    ตื่นเช้า: >
      MCU of a Thai woman waking up refreshed, stretching arms with a gentle smile,
      eyes slowly opening. Soft golden morning light filling the room,
      clean white bedding, well-rested healthy glow on skin.
    ทำอาหาร: >
      Medium shot of a Thai woman happily preparing a healthy salad in a clean
      modern kitchen. Vibrant colorful ingredients on the counter,
      natural fluid chopping motion, warm natural light, genuine smile.

  example_prompt:
    subtitle: "ลองเปลี่ยนนิสัยง่ายๆ แค่เดินวันละ 30 นาที"
    video: >
      Aspirational lifestyle footage, 8K, cinematic warm tones.
      Smooth tracking shot following a well-groomed middle-class Thai woman
      aged 50 walking briskly in a lush green park with tall trees.
      Healthy and energetic expression, genuine happy smile,
      casual comfortable activewear, arms swinging naturally.
      Warm golden hour lighting creating soft lens flares through the leaves,
      green foliage in soft bokeh background.
      Gentle handheld motion, energetic but graceful pace, 3 seconds.


# =====================================================
# CATEGORY H: ธรรมชาติ & สมุนไพร (Nature & Herbs)
# =====================================================
category_h_nature:
  name: "ธรรมชาติ & สมุนไพร (Nature & Herbs — Botanical)"
  trigger_keywords: ["สมุนไพร", "ขมิ้น", "โสม", "ใบบัวบก", "ว่านหางจระเข้", "มะขามป้อม", "กระชาย", "ฟ้าทะลายโจร", "สารสกัด", "ธรรมชาติ", "ออร์แกนิก", "น้ำมันปลา", "น้ำมันมะพร้าว"]

  video_rules: >
    - สไตล์: Premium botanical photography, lush and natural, 8K, macro detail
    - เฟรม: Close-up หรือ Macro ของพืช/สมุนไพร ให้เห็นรายละเอียดพื้นผิว
    - กล้อง: Slow macro dolly across leaves/herbs surface, or gentle pull-back reveal
    - เอฟเฟกต์: Morning dew drops glistening, soft wind rustling on leaves, natural golden hour light flares, particles floating
    - สี: เขียวสด, ทอง, น้ำตาลดิน — โทนธรรมชาติ organic
    - ฉากหลัง: ต้นไม้สด, สวนสมุนไพร, หรือ clean dark wood surface กับใบไม้ประดับ
    - อารมณ์: สด สะอาด บริสุทธิ์ น่าไว้ใจ (Organic/Natural feel) — เหมือนแบรนด์ premium organic
    - จังหวะ: Peaceful, organic, calming — ช้าสบายๆ
    - ห้าม: ดูเหมือนสมุนไพรแห้งในถุงพลาสติก / ตลาดสด / สมุนไพรจีนเก่าๆ
    - ความยาว: 3-4 วินาที

  classic_shots:
    ขมิ้น: >
      Slow macro dolly across a freshly cut vibrant turmeric root revealing
      intense golden-orange interior on a dark wood surface. Scattered turmeric
      powder particles floating gently in the air, warm golden hour backlighting
      creating a glowing halo effect.
    โสม: >
      Gentle pull-back reveal of a fresh ginseng root with fine delicate root hairs
      placed on natural linen cloth. Soft natural backlighting, morning dew droplets
      on the surface, organic earthy feel, premium botanical aesthetic.
    ใบบัวบก: >
      Macro shot of fresh green centella asiatica (gotu kola) leaves with
      glistening morning dew drops. Soft wind rustling the leaves gently,
      lush green bokeh background, natural garden setting, calming atmosphere.
    น้ำมันปลา: >
      Close-up of golden translucent fish oil flowing in beautiful slow motion,
      amber liquid catching and refracting light. Clean white background,
      premium pharmaceutical feel, volumetric light rays through the oil.
    กระชาย: >
      Macro close-up of fresh fingerroot (krachai) on a dark stone surface,
      vibrant yellow interior visible from a clean diagonal cut.
      Subtle steam or mist rising, warm natural backlighting, earthy organic feel.
    ฟ้าทะลายโจร: >
      Macro shot of fresh andrographis paniculata leaves with delicate small
      white flowers. Natural garden setting, morning dew on petals,
      soft wind movement, peaceful and medicinal atmosphere.
    สมุนไพรรวม: >
      Slow overhead dolly across assorted Thai herbs beautifully arranged
      on a clean wooden board: turmeric, lemongrass, galangal, kaffir lime leaves.
      Soft natural daylight, vibrant earthy colors, organic premium feel.

  example_prompt:
    subtitle: "ขมิ้นชันมีสาร Curcumin ที่ช่วยลดการอักเสบได้อย่างดี"
    video: >
      Premium botanical macro footage, 8K, extremely detailed textures.
      Slow macro dolly across a freshly cut vibrant turmeric root revealing
      its intense golden-orange interior with visible fiber textures.
      Placed on a dark wooden surface with scattered turmeric powder.
      Golden powder particles floating gently in the air, catching warm backlight.
      Soft natural daylight with golden hour backlighting creating a warm glowing halo.
      Organic and pure atmosphere, premium botanical brand feel, 4 seconds.


# =====================================================
# GENERAL RULES
# =====================================================
general_rules:
  aspect_ratio: "9:16 (Vertical / Portrait)"
  duration_per_scene: "3-4 seconds"
  language: "All prompts must be in English"
  quality_tags: "Always include: 8K, cinematic, detailed textures (หรือ equivalent ตาม Category)"
  prompt_format: >
    Video Prompt = "[สไตล์ + คุณภาพ], [ตัวแบบ + ท่าทาง + เสื้อผ้า/ลักษณะ], [ฉากหลัง/สถานที่],
    [camera movement], [แสง/สี/อารมณ์], [เอฟเฟกต์], [ความยาว]"
    ทุกอย่างรวมใน prompt เดียว ไม่ต้องแยก image / motion
    ทุก prompt ต้องมีอย่างน้อย 4-6 บรรทัดของรายละเอียด
  dopamine_rule: >
    กฎ Dopamine Hit (สร้างจังหวะเปลี่ยนภาพทุก 3-5 วินาที):
    1. เลือก Category ตาม "เนื้อหาของซับไทเทิล" เป็นหลัก — ภาพต้องตรงกับสิ่งที่พูดเสมอ
    2. ถ้าซับ 2-3 ประโยคติดกันตรงกับ Category เดียวกัน (เช่น A-A-A) ให้พยายามเปลี่ยนมุมกล้อง/ท่าทาง/องค์ประกอบภาพ เพื่อให้ยังมี "ภาพเปลี่ยน" ทุก 3-5 วิ ถึงแม้จะอยู่ Category เดิม
    3. ห้ามบังคับ Category ที่ไม่ตรงกับเนื้อหาเด็ดขาด (เช่น ซับพูดเรื่องปวดเข่า แต่ไปโชว์ภาพขมิ้น)
    4. ความหลากหลายของ Category เป็นเรื่องรอง — ถ้าเนื้อหาพาให้ซ้ำ Category ก็ซ้ำได้ แต่ต้องเปลี่ยน "มุมมอง" ภายใน Category นั้น
  forbidden:
    - "ภาพน่าเบื่อ (คนนั่งคุยหมอ, ผลไม้เรียงบนโต๊ะ, คนวิ่งจ๊อกกิ้ง)"
    - "ภาพเลือด/กอร์ ที่น่ากลัวเกินไป"
    - "ภาพคน Full Body / Wide shot (สำหรับ Category A)"
    - "ภาพมุมกล้องแปลกๆ ที่ไม่คลาสสิค"
    - "ภาพหน้าคนที่ดูน่ากลัว/หลอน/โทรมมากเกินไป"
    - "Prompt ที่สั้นเกินไป (น้อยกว่า 3 บรรทัด) — ต้องละเอียดเสมอ"
