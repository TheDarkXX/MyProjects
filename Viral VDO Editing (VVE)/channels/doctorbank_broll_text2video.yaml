    สารอาหาร_ดี: "Golden / Warm White glow"
    สารอาหาร_ร้าย: "Red / Dark Orange / Spiky crystals"
    เซลล์_ปกติ: "Soft Blue / Teal pulsating"
    เซลล์_ถูกโจมตี: "Dimming blue with cracks"
    ภูมิคุ้มกัน: "Golden energy shield / barrier"
    ไวรัส_แบคทีเรีย: "Dark spiky particles / Purple-black"

  example_prompt:
    subtitle: "วิตามินจะเปรียบเสมือนเกราะป้องกัน ไม่ให้ไวรัสเข้าสู่เซลล์"
