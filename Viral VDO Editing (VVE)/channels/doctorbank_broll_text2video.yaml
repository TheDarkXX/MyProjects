# CATEGORY C: ระดับเซลล์ / โมเลกุล (Micro — Sci-Fi)
# =====================================================
category_c_micro:
  name: "ระดับเซลล์ / โมเลกุล (Micro — Sci-Fi Medical)"
  trigger_keywords: ["วิตามิน", "แคลเซียม", "โปรตีน", "คอลลาเจน", "ภูมิคุ้มกัน", "เม็ดเลือด", "เซลล์", "สารอาหาร", "น้ำตาล", "ไขมัน", "โมเลกุล", "แอนตี้ออกซิแดนท์"]
  
  video_rules: >
    - สไตล์: Hyper-realistic microscopic visualization, 8K, Unreal Engine 5 render, extremely detailed textures
    - เฟรม: Cinematic dark background with floating particles, shallow depth of field
    - กล้อง: Slow smooth zoom in, with depth of field shift (rack focus)
    - เอฟเฟกต์: Microscopic floating particles, gentle fluid dynamics, glowing accents, volumetric light rays
    - สี: ทอง/Warm White = สารอาหารดี, แดง/ส้ม/Spiky crystals = อันตราย, ฟ้า/Teal = เซลล์ปกติ, ม่วงดำ = ไวรัส/แบคทีเรีย
    - อารมณ์: เหมือนสารคดี Netflix / ดูว้าวล้ำ / Sci-Fi medical
    - จังหวะ: Cinematic slow motion, ช้ามาก สง่า
    - ความยาว: 3-4 วินาที

  color_coding:
    สารอาหาร_ดี: "Golden / Warm White glow, smooth spherical particles"
    สารอาหาร_ร้าย: "Red / Dark Orange / Spiky crystals, jagged edges"
    เซลล์_ปกติ: "Soft Blue / Teal pulsating, smooth membrane"
    เซลล์_ถูกโจมตี: "Dimming blue with cracks and flickering light"
    ภูมิคุ้มกัน: "Golden energy shield / barrier with hexagonal pattern"
    ไวรัส_แบคทีเรีย: "Dark spiky particles / Purple-black, menacing motion"

  example_prompt:
    subtitle: "วิตามินจะเปรียบเสมือนเกราะป้องกัน ไม่ให้ไวรัสเข้าสู่เซลล์"
    video: >
      Hyper-realistic microscopic visualization, 8K, Unreal Engine 5 render,
      extremely detailed textures. A vibrant glowing golden energy shield
      with hexagonal pattern surrounding a healthy pulsating soft blue cell
      with smooth translucent membrane. Dark spiky purple-black virus particles
      bouncing off the golden shield in cinematic slow motion, glowing particle
      trails scattering on each impact, volumetric light rays piercing through.
      Camera slowly zooms in with rack focus shift from background viruses
      to foreground shield detail. Cinematic dark background with floating
      microscopic particles, ethereal lighting, Netflix documentary feel, 4 seconds.


