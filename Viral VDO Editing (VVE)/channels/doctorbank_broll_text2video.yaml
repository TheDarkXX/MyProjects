# =====================================================
# GENERAL RULES
# =====================================================
general_rules:
  aspect_ratio: "9:16 (Vertical / Portrait)"
  duration_per_scene: "3-4 seconds"
  language: "All prompts must be in English"
  prompt_format: >
    Video Prompt = "[สไตล์], [องค์ประกอบ + ท่าทาง/action], [camera movement], [lighting/mood], [duration]"
    ทุกอย่างรวมใน prompt เดียว ไม่ต้องแยก image / motion
  dopamine_rule: >
    กฎ Dopamine Hit:
    1. เลือก Category ตาม "เนื้อหาของซับ" เป็นหลัก
    2. ถ้าซับ 2-3 ประโยคติดกัน Category เดียวกัน → เปลี่ยนมุมกล้อง/ท่าทาง/องค์ประกอบ
    3. ห้ามบังคับ Category ที่ไม่ตรงกับเนื้อหา
    4. ความหลากหลาย Category เป็นเรื่องรอง — ซ้ำได้แต่ต้องเปลี่ยน "มุมมอง"
  forbidden:
    - "ภาพน่าเบื่อ (คนนั่งคุยหมอ, ผลไม้เรียงบนโต๊ะ)"
    - "ภาพเลือด/กอร์ ที่น่ากลัวเกินไป"
    - "Full Body / Wide shot (สำหรับ Category A)"
    - "มุมกล้องแปลกๆ ที่ไม่คลาสสิค"
    - "หน้าคนที่ดูน่ากลัว/หลอน/โทรมมากเกินไป"
