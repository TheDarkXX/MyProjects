      Hyper-realistic microscopic visualization, a vibrant glowing golden
      energy shield surrounding a healthy pulsating blue cell,
      dark spiky virus particles bouncing off the shield in slow motion,
      glowing particle trails scattering. Camera slowly zooms in,
      shallow depth of field shift. Cinematic dark background,
      ethereal lighting, UE5 render, 4 seconds.


